version: '3.8'

services:
  chatbot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnichannel-chatbot-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:@mysql:3306/chatbot
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_change_me_in_production
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: chatbot-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: chatbot
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
